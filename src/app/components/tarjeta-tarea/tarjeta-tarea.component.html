<ion-item-sliding>
  <ion-item lines="none" class="task-item" [class.task-item--done]="tarea.completada">
    <ion-checkbox
      slot="start"
      justify="start"
      [checked]="tarea.completada"
      (ionChange)="onToggleCompleted($event.detail.checked)"
    ></ion-checkbox>

    <ion-label>
      <h2>{{ tarea.titulo }}</h2>
      <p>{{ tarea.descripcion || ('TASKS.EMPTY_DESCRIPTION' | translate) }}</p>
    </ion-label>
  </ion-item>

  <ion-item-options side="end">
    <ion-item-option color="tertiary" (click)="onEdit()">
      <ion-icon slot="icon-only" name="pencil-outline"></ion-icon>
    </ion-item-option>
    <ion-item-option color="danger" (click)="onDelete()">
      <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
    </ion-item-option>
  </ion-item-options>
</ion-item-sliding>
